[project]
name = "analysis-project-roht-phase2"
version = "0.1.0"
description = "Reproducible Python environment for the Rohto phase 2 analysis"
requires-python = ">=3.14,<3.15"
dependencies = [
    "autoreject>=0.4.4",
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "mne[hdf5]>=1.13",
    "mne-icalabel[ica,onnx]>=0.9",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "python-picard>=0.8.2",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.ruff]
extend-exclude = [
    "参考資料*",
    "解析プログラム（過去版いらなくなったやつ）*",
]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
